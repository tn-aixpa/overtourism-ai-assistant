[project]
name = "digital-twin-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.86.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "openai>=2.26.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]
[project.optional-dependencies]
log = [
    "ecs-logging==2.3.0",
    "concurrent-log-handler==0.9.31",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
